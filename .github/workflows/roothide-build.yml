name: Build CPUOverloadKiller RootHide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roothide-build.yml'
      - '**/*.h'
      - '**/*.c'
      - '**/*.m'
      - '**/*.mm'
      - '**/*.xm'
      - '**/*.plist'
      - 'Makefile'
      - 'control'
      - 'layout/**'
      - 'vedetteprefs/**'

jobs:
  package:
    name: Package (RootHide)
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1
      PREFIX: /Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "17.5"

      - name: Install tools
        run: brew install dpkg ldid make

      - name: Install RootHide Theos and SDK
        run: |
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          mkdir -p "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include/libproc"
          cp libproc/libproc.h "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include/libproc/libproc.h"

      - name: Check global guard invariants
        run: python3 tests/check_global_guard.py

      - name: Build package
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:17.5:15.0 SYSROOT="$SYSROOT" 2>&1 | tee /tmp/build.log

      - name: Verify package
        run: |
          deb="$(find packages -maxdepth 1 -name 'com.moxuan.cpuoverloadkiller_*.deb' -print -quit)"
          test -n "$deb" && test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "com.moxuan.cpuoverloadkiller"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          dpkg-deb -c "$deb" | grep -q 'CPUOverloadKiller.dylib'
          dpkg-deb -c "$deb" | grep -q 'CPUOverloadKillerPrefs.bundle/CPUOverloadKillerPrefs'
          dpkg-deb -c "$deb" | grep -q 'CPUOverloadKillerPrefs.bundle/CPUOverloadKiller.png'
          dpkg-deb -c "$deb" | grep -q 'CPUOverloadKillerPrefs.bundle/CPUOverloadKiller@2x.png'
          dpkg-deb -c "$deb" | grep -q 'CPUOverloadKillerPrefs.bundle/CPUOverloadKiller@3x.png'
          ! dpkg-deb -c "$deb" | grep -Eq 'Vedette|PayPal|Reddit|Twitter'

      - name: Upload RootHide deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-overload-killer-roothide
          path: packages/*.deb
          if-no-files-found: error
